<!DOCTYPE html><html><body style="margin:0;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;color:#1C1C1E">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F2F7;padding:24px 12px"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:16px">
<tr><td style="padding:28px 28px 8px"><div style="font-size:20px;font-weight:700">{{ restaurant.name }}</div></td></tr>
<tr><td style="padding:8px 28px 8px;font-size:16px;line-height:1.6;white-space:pre-wrap">{{ message }}</td></tr>
{% if offer_code %}<tr><td style="padding:12px 28px 4px"><div style="display:inline-block;border:2px dashed #007AFF;border-radius:12px;padding:10px 18px;font:700 18px Menlo,monospace;color:#007AFF;letter-spacing:.06em">{{ offer_code }}</div></td></tr>{% endif %}
<tr><td style="padding:24px 28px 28px;font-size:12px;color:#8E8E93">You are receiving this because you visited {{ restaurant.name }}. <a href="{{ unsubscribe_url }}" style="color:#8E8E93">Unsubscribe</a></td></tr>
</table></td></tr></table></body></html>

{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{% block title %}{{ restaurant.name }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F2F2F7; --card:#FFFFFF; --label:#1C1C1E; --label2:#6E6E73; --sep:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12); --accent:#007AFF; --star:#FFB800; --green:#34C759; --red:#FF3B30; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1C1C1E; --label:#F2F2F7; --label2:#AEAEB2; --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --accent:#0A84FF; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--label); font:16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:520px; margin:0 auto; padding:28px 16px calc(40px + env(safe-area-inset-bottom)); }
  .brand { text-align:center; margin-bottom:18px; }
  .brand h1 { font-size:24px; margin:0; font-weight:700; letter-spacing:-.01em; }
  .brand p { margin:4px 0 0; color:var(--label2); font-size:14px; }
  .card { background:var(--card); border-radius:18px; padding:20px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card h2 { font-size:17px; margin:0 0 12px; font-weight:600; }
  label { display:block; font-size:13px; font-weight:600; color:var(--label2); margin:12px 0 6px; }
  input[type=text], input[type=tel], input[type=email], textarea, select { width:100%; font:inherit; color:var(--label); background:var(--fill); border:0; border-radius:11px; padding:12px 14px; outline:none; }
  input:focus, textarea:focus, select:focus { box-shadow:0 0 0 3px rgba(0,122,255,.3); }
  textarea { min-height:110px; resize:vertical; }
  .stars { display:flex; justify-content:center; gap:6px; flex-direction:row-reverse; }
  .stars input { position:absolute; opacity:0; pointer-events:none; }
  .stars label { margin:0; font-size:42px; line-height:1; color:var(--fill); cursor:pointer; transition:transform .12s, color .12s; }
  .stars label:active { transform:scale(.9); }
  .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color:var(--star); }
  .stars input:focus-visible + label { outline:2px solid var(--accent); border-radius:6px; }
  .mini { display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--sep); }
  .mini:first-of-type { border-top:0; }
  .mini span { font-size:15px; }
  .mini .stars label { font-size:26px; }
  .nps { display:grid; grid-template-columns:repeat(11, 1fr); gap:4px; }
  .nps input { position:absolute; opacity:0; }
  .nps label { margin:0; text-align:center; padding:9px 0; border-radius:8px; background:var(--fill); color:var(--label); font-size:14px; font-weight:600; cursor:pointer; }
  .nps input:checked + label { background:var(--accent); color:#fff; }
  .nps-legend { display:flex; justify-content:space-between; font-size:12px; color:var(--label2); margin-top:6px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg input { position:absolute; opacity:0; }
  .seg label { margin:0; padding:8px 14px; border-radius:999px; background:var(--fill); color:var(--label); font-size:14px; font-weight:500; cursor:pointer; }
  .seg input:checked + label { background:var(--label); color:var(--card); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .check { display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--label2); font-weight:400; }
  .btn { display:block; width:100%; border:0; border-radius:14px; background:var(--accent); color:#fff; font:600 17px Inter, sans-serif; padding:15px; cursor:pointer; margin-top:6px; }
  .btn.secondary { background:var(--fill); color:var(--label); }
  .err { background:rgba(255,59,48,.12); color:var(--red); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:14px; }
  .done { text-align:center; padding:36px 20px; }
  .done .icon { width:64px; height:64px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-size:32px; margin:0 auto 14px; }
  .muted { color:var(--label2); font-size:14px; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  @media (max-width: 380px) { .nps label { font-size:12px; padding:8px 0; } .row2 { grid-template-columns:1fr; } }
</style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light sticky-top bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand" href="{% if restaurant %}/r/{{ restaurant.slug }}{% else %}/{% endif %}">
      <i class="bi bi-egg-fried me-2"></i>Delicious Bites
    </a>
    <div class="d-flex align-items-center">
      {% if restaurant %}
      <a class="btn btn-outline-primary me-2" href="/r/{{ restaurant.slug }}/">Menu</a>
      <a class="btn btn-outline-secondary me-2" href="/r/{{ restaurant.slug }}/orders/">My Orders</a>
      <a class="btn btn-primary" href="/r/{{ restaurant.slug }}/cart/"><i class="bi bi-cart3"></i></a>
      {% endif %}
    </div>
  </div>
  </nav>

<div class="container py-4">
  <h2 class="mb-3">Reserve a Table</h2>
  <form id="reserveForm" class="card p-3">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Your Name</label>
        <input class="form-control" name="customer_name" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input class="form-control" name="phone" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Email (optional)</label>
        <input type="email" class="form-control" name="email" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Party Size</label>
        <input type="number" min="1" class="form-control" name="party_size" value="2" required />
      </div>
      <div class="col-md-3">
        <label class="form-label">Duration (minutes)</label>
        <input type="number" min="30" step="15" class="form-control" name="duration_minutes" value="90" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Date</label>
        <input type="date" class="form-control" name="date" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Start Time</label>
        <input type="time" class="form-control" name="start_time" required />
      </div>
      <div class="col-12">
        <label class="form-label">Occasion (optional)</label>
        <input class="form-control" name="occasion" />
      </div>
      <div class="col-12">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-control" name="notes" rows="2"></textarea>
      </div>
      <div class="col-12 d-flex gap-2">
        <button type="button" id="checkBtn" class="btn btn-outline-primary">Check Availability</button>
        <button type="submit" class="btn btn-success">Reserve</button>
      </div>
      <div id="result" class="mt-2"></div>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
  const rslug = window.location.pathname.split('/').filter(Boolean)[1];
  const form = document.getElementById('reserveForm');
  const result = document.getElementById('result');
  const checkBtn = document.getElementById('checkBtn');
  function getFormData(){
    const fd = new FormData(form);
    return Object.fromEntries(fd.entries());
  }
  function show(msg, cls){
    result.innerHTML = `<div class="alert ${cls||'alert-info'}">${msg}</div>`;
  }
  checkBtn.addEventListener('click', async () => {
    const d = getFormData();
    if(!d.date || !d.start_time){ return show('Please select date and time','alert-warning'); }
    const url = new URL('/api/reservations/availability/', window.location.origin);
    url.searchParams.set('restaurant_slug', rslug);
    url.searchParams.set('date', d.date);
    url.searchParams.set('start_time', d.start_time);
    url.searchParams.set('duration', d.duration_minutes||90);
    url.searchParams.set('party_size', d.party_size||2);
    const res = await fetch(url);
    const js = await res.json();
    if(js.available){ show('Great! The selected slot is available.','alert-success'); }
    else{ show(js.message || 'Slot not available','alert-danger'); }
  });
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const payload = getFormData();
    payload.restaurant_slug = rslug;
    try{
      const res = await fetch('/api/reservations/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const js = await res.json();
      if(res.ok){
        show(`Reservation submitted. Status: ${js.status_display || 'Pending'}. Ref #${js.id}`,'alert-success');
        form.reset();
      }else{
        show(`Error: ${JSON.stringify(js)}`,'alert-danger');
      }
    }catch(err){
      show('Network error','alert-danger');
    }
  });
})();
</script>
</body>
</html>

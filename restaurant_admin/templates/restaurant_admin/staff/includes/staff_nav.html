<!-- Shared Staff & Operations Cockpit Top Navigation Header -->
<div class="card border-0 shadow-sm mb-4 bg-white" style="border-radius: 12px;">
    <div class="card-body p-2 p-md-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center gap-1 flex-wrap">
                <a href="{% url 'restaurant_admin:muster_roll' restaurant_slug=rslug %}" 
                   class="btn btn-sm {% if active_menu == 'attendance_muster' %}btn-primary text-white shadow-xs{% else %}btn-light text-dark{% endif %} rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5">
                    <i class="bi bi-calendar2-check"></i>
                    <span>Daily Muster Roll</span>
                </a>
                <a href="{% url 'restaurant_admin:payroll_dashboard' restaurant_slug=rslug %}" 
                   class="btn btn-sm {% if active_menu == 'payroll_dashboard' %}btn-primary text-white shadow-xs{% else %}btn-light text-dark{% endif %} rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5">
                    <i class="bi bi-cash-coin"></i>
                    <span>Payroll & Salary Slips</span>
                </a>
                <a href="{% url 'restaurant_admin:sop_dashboard' restaurant_slug=rslug %}" 
                   class="btn btn-sm {% if active_menu == 'sop_dashboard' %}btn-primary text-white shadow-xs{% else %}btn-light text-dark{% endif %} rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5">
                    <i class="bi bi-clipboard2-check"></i>
                    <span>Daily SOP Board</span>
                </a>
                <a href="{% url 'restaurant_admin:ground_staff_list' restaurant_slug=rslug %}" 
                   class="btn btn-sm {% if active_menu == 'ground_staff_directory' %}btn-primary text-white shadow-xs{% else %}btn-light text-dark{% endif %} rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5">
                    <i class="bi bi-person-lines-fill"></i>
                    <span>Ground Staff Team</span>
                </a>
                <a href="{% url 'restaurant_admin:staff_list' restaurant_slug=rslug %}" 
                   class="btn btn-sm {% if active_menu == 'staff' %}btn-primary text-white shadow-xs{% else %}btn-light text-dark{% endif %} rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5">
                    <i class="bi bi-shield-lock"></i>
                    <span>Logins & Roles</span>
                </a>
            </div>
            <div class="d-none d-md-flex align-items-center gap-2">
                <span class="badge bg-light text-secondary border px-2.5 py-1.5 rounded-pill" style="font-size: 0.78rem;">
                    <i class="bi bi-building me-1"></i>{{ current_branch.name|default:current_restaurant.name }}
                </span>
            </div>
        </div>
    </div>
</div>

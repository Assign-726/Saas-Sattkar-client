<style>
    /* Club & Events — shared by every Club screen in the Restaurant and Hotel admin. Colours come from apple-ui tokens. */
    .club-page { padding: 20px 4px 40px; }
    .club-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .club-head h1 { font-size: 1.45rem; font-weight: 700; color: var(--ui-label); margin: 0; letter-spacing: -0.01em; }
    .club-head p { margin: 4px 0 0; color: var(--ui-label-2); font-size: 0.86rem; }
    .club-head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .club-tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--ui-fill); overflow-x: auto;
                 scrollbar-width: none; margin-bottom: 18px; }
    .club-tabs::-webkit-scrollbar { display: none; }
    .club-tabs a { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 9px;
                   color: var(--ui-label-2); font-weight: 600; font-size: 0.85rem; text-decoration: none; white-space: nowrap; }
    .club-tabs a:hover { color: var(--ui-label); background: var(--ui-fill-2); }
    .club-tabs a.on { background: var(--ui-surface); color: var(--ui-label); box-shadow: var(--ui-shadow-card); }
    .club-tabs a i { font-size: 0.85rem; opacity: 0.8; }

    .club-switch { position: relative; }
    .club-switch > button { display: inline-flex; align-items: center; gap: 8px; max-width: 320px; padding: 8px 14px; border-radius: 10px;
                            border: 1px solid var(--ui-separator); background: var(--ui-surface); color: var(--ui-label); font-weight: 600; font-size: 0.86rem; }
    .club-switch > button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .club-switch .dropdown-menu { max-height: 340px; overflow-y: auto; min-width: 280px; }
    .club-switch .dropdown-item small { display: block; color: var(--ui-label-3); font-size: 0.74rem; }

    .club-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .club-kpi { background: var(--ui-surface); border: 1px solid var(--ui-separator); border-radius: 14px; padding: 14px 16px; }
    .club-kpi .k { font-size: 0.72rem; font-weight: 600; color: var(--ui-label-2); text-transform: uppercase; letter-spacing: 0.02em; }
    .club-kpi .v { font-size: 1.45rem; font-weight: 700; color: var(--ui-label); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .club-kpi .v small { font-size: 0.85rem; color: var(--ui-label-3); font-weight: 600; }
    .club-kpi .s { font-size: 0.76rem; color: var(--ui-label-3); margin-top: 2px; }
    .club-kpi.good .v { color: var(--ui-green-text); }
    .club-kpi.warn .v { color: var(--ui-orange-text); }

    .club-card { background: var(--ui-surface); border: 1px solid var(--ui-separator); border-radius: 16px; }
    .club-card.pad { padding: 18px; }
    .club-section-title { font-size: 0.95rem; font-weight: 700; color: var(--ui-label); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }

    .club-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; white-space: nowrap; }
    .club-chip.live { background: rgba(var(--ui-red-rgb), 0.14); color: var(--ui-red-text); }
    .club-chip.live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ui-red); animation: clubPulse 1.4s infinite; }
    .club-chip.upcoming { background: rgba(var(--ui-green-rgb), 0.14); color: var(--ui-green-text); }
    .club-chip.draft { background: var(--ui-fill); color: var(--ui-label-2); }
    .club-chip.ended { background: var(--ui-fill); color: var(--ui-label-3); }
    .club-chip.featured { background: rgba(var(--ui-orange-rgb), 0.16); color: var(--ui-orange-text); }
    .club-chip.paid { background: rgba(var(--ui-green-rgb), 0.14); color: var(--ui-green-text); }
    .club-chip.pending { background: rgba(var(--ui-orange-rgb), 0.16); color: var(--ui-orange-text); }
    .club-chip.cancelled, .club-chip.failed, .club-chip.expired { background: rgba(var(--ui-red-rgb), 0.12); color: var(--ui-red-text); }
    .club-chip.in { background: var(--ui-green); color: #fff; }
    .club-chip.out { background: var(--ui-fill); color: var(--ui-label-2); }
    @keyframes clubPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .club-bar { height: 6px; border-radius: 999px; background: var(--ui-fill); overflow: hidden; }
    .club-bar > span { display: block; height: 100%; border-radius: 999px; background: var(--ui-green); }
    .club-bar.hot > span { background: var(--ui-orange); }
    .club-bar.full > span { background: var(--ui-red); }

    .club-empty { text-align: center; padding: 48px 20px; color: var(--ui-label-2); }
    .club-empty i.big { font-size: 2.4rem; color: var(--ui-label-3); margin-bottom: 12px; display: block; }
    .club-empty h3 { font-size: 1.05rem; font-weight: 700; color: var(--ui-label); margin-bottom: 6px; }
    .club-empty p { max-width: 460px; margin: 0 auto 16px; font-size: 0.86rem; }

    .club-search { position: relative; }
    .club-search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ui-label-3); font-size: 0.85rem; pointer-events: none; }
    .club-search input { padding-left: 34px !important; }

    .club-kbd { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--ui-separator-strong);
                font: 600 0.7rem var(--ui-font-mono); color: var(--ui-label-2); background: var(--ui-surface-2); text-align: center; }

    .club-toasts { position: fixed; right: 16px; bottom: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
    .club-toast { padding: 11px 14px; border-radius: 12px; background: var(--ui-label); color: var(--ui-surface); font-size: 0.86rem; font-weight: 600;
                  box-shadow: var(--ui-shadow-pop); animation: clubToast .2s ease-out; display: flex; gap: 8px; align-items: flex-start; }
    .club-toast.bad { background: var(--ui-red); color: #fff; }
    @keyframes clubToast { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 575.98px) {
        .club-page { padding-top: 12px; }
        .club-head h1 { font-size: 1.2rem; }
        .club-head-actions { width: 100%; }
        .club-head-actions .club-switch, .club-head-actions .club-switch > button { width: 100%; max-width: none; }
        .club-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
</style>
<script>
    window.clubToast = function (msg, bad) {
        let box = document.querySelector('.club-toasts');
        if (!box) { box = document.createElement('div'); box.className = 'club-toasts'; box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
        const t = document.createElement('div');
        t.className = 'club-toast' + (bad ? ' bad' : '');
        const i = document.createElement('i'); i.className = 'fas ' + (bad ? 'fa-circle-exclamation' : 'fa-circle-check'); i.style.marginTop = '2px';
        const s = document.createElement('span'); s.textContent = msg;
        t.append(i, s); box.appendChild(t);
        setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, bad ? 5000 : 3000);
    };
</script>

{% extends 'restaurant_admin/base.html' %}
{% block title %}Zones - Admin Panel{% endblock %}
{% block content %}
<div class="container-fluid px-4 py-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Zones</h1>
        <a href="{% url 'restaurant_admin:zone_add' restaurant_slug=restaurant_slug %}" class="btn btn-primary">Add Zone</a>
    </div>
    <div class="card p-4">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Tables</th>
                </tr>
            </thead>
            <tbody>
                {% for zone in zones %}
                <tr>
                    <td>{{ zone.name }}</td>
                    <td>{{ zone.tables.count }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center">No zones found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

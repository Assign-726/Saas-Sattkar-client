<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOT {{ order.order_number }} - {{ restaurant.name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  {% include 'restaurant_admin/orders/_kot_thermal_css.html' %}
</head>
<body>

  <!-- Top Action Bar -->
  <div class="top-action-bar">
    <button onclick="window.print()" class="btn-action primary">
      <i class="bi bi-printer-fill"></i> Print KOT
    </button>
    <a href="?template=standard" class="btn-action" title="View standard ticket format">
      <i class="bi bi-card-text"></i> Switch to Standard
    </a>
    <button onclick="window.close()" class="btn-action">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  {% include 'restaurant_admin/orders/_kot_thermal_slips.html' %}

  <script>
    // Auto trigger print when requested via ?autoprint=1 or direct pos action
    window.addEventListener('load', function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('autoprint') === '1') {
        setTimeout(function() { window.print(); }, 250);
      }
    });
  </script>
  <script>
    // Esc closes the preview tab so the cashier never needs the mouse.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !e.defaultPrevented) {
        e.preventDefault();
        window.close();
      }
    });
  </script>
</body>
</html>

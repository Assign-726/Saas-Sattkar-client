  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f1f5f9;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #1e293b;
      padding: 20px 10px;
    }

    /* Top Action Bar (Hidden on Print) */
    .top-action-bar {
      max-width: 80mm;
      margin: 0 auto 16px;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
    }
    .btn-action {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .btn-action.primary {
      background: #dc2626;
      color: #ffffff;
      border-color: #dc2626;
    }
    .btn-action.primary:hover {
      background: #b91c1c;
    }

    /* Thermal KOT Container (80mm / ~3 inches) */
    .thermal-kot {
      width: 78mm;
      margin: 0 auto 20px;
      background: #ffffff;
      padding: 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      font-family: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #000000;
    }

    .pCenter {
      text-align: center;
    }
    .pTitle {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .pTableBox {
      border: 2.5px solid #000000;
      padding: 6px 10px;
      margin: 8px auto;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 1px;
      background: #ffffff;
      display: block;
    }
    .pRule {
      border-top: 1px dashed #000000;
      margin: 6px 0;
    }
    .pRuleHeavy {
      border-top: 2.5px solid #000000;
      margin: 8px 0;
    }
    .pMetaRow {
      display: flex;
      justify-content: space-between;
      gap: 6px;

      padding: 1px 0;
    }
    .pItemsTable {
      width: 100%;
      border-collapse: collapse;
      margin: 6px 0;
    }
    .pItemsTable th {
      font-size: 13px;
      font-weight: 800;
      border-bottom: 1.5px solid #000000;
      padding-bottom: 4px;
      text-align: left;
    }
    .pItemsTable td {
      padding: 5px 0;
      vertical-align: top;
    }
    .pQtyCol {
      font-size: 16px;
      font-weight: 800;
      width: 40px;
    }
    .pItemName {
      font-size: 13px;
      font-weight: 700;
    }
    .pItemNote {
      font-size: 11px;
      font-style: italic;
      padding-top: 2px;
    }
    .pCountRow {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-top: 6px;
    }

    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .top-action-bar {
        display: none !important;
      }
      .thermal-kot {
        width: 78mm !important;
        max-width: 78mm !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 2mm 3mm !important;
        margin: 0 0 10mm 0 !important;
        page-break-after: always !important;
        break-after: page !important;
      }
      .thermal-kot:last-child {
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      @page {
        size: 80mm auto;
        margin: 0;
      }
    }
  </style>

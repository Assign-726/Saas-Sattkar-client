  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f1f5f9;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #1e293b;
      padding: 20px 10px;
    }

    /* Top Action Bar (Hidden on Print) */
    .top-action-bar {
      max-width: 80mm;
      margin: 0 auto 16px;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
    }
    .btn-action {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .btn-action.primary {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .btn-action.primary:hover {
      background: #1d4ed8;
    }

    /* Thermal Receipt Container (80mm / ~3 inches) */
    .thermal-receipt {
      width: 78mm;
      margin: 0 auto;
      background: #ffffff;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      font-family: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      font-size: 11.5px;
      line-height: 1.45;
      color: #000000;
    }

    .pCenter {
      text-align: center;
    }
    .pBig {
      font-weight: 700;
      font-size: 14px;
    }
    .pTitle {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .pAddress {
      font-size: 10.5px;
      line-height: 1.35;
      margin-bottom: 3px;
    }
    .pGstFssai {
      font-size: 10px;
      line-height: 1.35;
    }
    .pRule {
      border-top: 1px dashed #000000;
      margin: 6px 0;
    }
    .pRuleHeavy {
      border-top: 2px dashed #000000;
      margin: 8px 0 6px;
    }
    .pRow {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      padding: 1.5px 0;
    }
    .pRow.bold {
      font-weight: 700;
    }
    .pItemNote {
      font-size: 10px;
      font-style: italic;
      padding-left: 10px;
      opacity: 0.85;
    }
    .pDiscount {
      color: #000000;
    }
    .pTotalRow {
      font-size: 14px;
      font-weight: 700;
      padding: 3px 0;
    }

    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .top-action-bar {
        display: none !important;
      }
      .thermal-receipt {
        width: 78mm !important;
        max-width: 78mm !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 2mm 3mm !important;
        margin: 0 !important;
      }
      @page {
        size: 80mm auto;
        margin: 0;
      }
    }
  </style>

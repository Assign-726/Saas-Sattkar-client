{% extends 'restaurant_admin/base.html' %}
{% block content %}
<div class="container-fluid py-3">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="card-title mb-0">Reservation Settings</h5>
      <a class="btn btn-outline-secondary" href="{% url 'restaurant_admin:reservation_list' restaurant.slug %}">Back to Reservations</a>
    </div>
    <div class="card-body">
      <form method="post" class="row g-3">
        {% csrf_token %}
        <div class="col-md-3">
          <label class="form-label">Open Time</label>
          {{ form.open_time }}
        </div>
        <div class="col-md-3">
          <label class="form-label">Close Time</label>
          {{ form.close_time }}
        </div>
        <div class="col-md-3">
          <label class="form-label">Slot Interval (minutes)</label>
          {{ form.slot_interval_minutes }}
        </div>
        <div class="col-md-3">
          <label class="form-label">Max Party Size</label>
          {{ form.max_party_size }}
        </div>
        <div class="col-md-4">
          <label class="form-label">Max Seats per Slot (optional)</label>
          {{ form.max_seats_per_slot }}
        </div>
        <div class="col-12">
          <button class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

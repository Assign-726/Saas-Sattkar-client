{% if l %}<input type="hidden" name="pk" value="{{ l.pk }}">{% endif %}
<div class="ui-field"><label for="ldC{{ suffix }}">Client / company</label><input id="ldC{{ suffix }}" class="ui-input" name="company" maxlength="150" required value="{{ l.company|default:'' }}"></div>
<div class="ui-inline-fields">
  <div class="ui-field"><label for="ldT{{ suffix }}">Type</label><select id="ldT{{ suffix }}" class="ui-input" name="lead_type">{% for k, v in types %}<option value="{{ k }}" {% if l.lead_type == k %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></div>
  <div class="ui-field"><label for="ldV{{ suffix }}">Estimated value ₹</label><input id="ldV{{ suffix }}" class="ui-input" type="number" min="0" name="value" value="{{ l.value|default:0|floatformat:'0' }}"></div>
</div>
<div class="ui-inline-fields">
  <div class="ui-field"><label for="ldP{{ suffix }}">Contact person</label><input id="ldP{{ suffix }}" class="ui-input" name="contact_name" maxlength="120" value="{{ l.contact_name|default:'' }}"></div>
  <div class="ui-field"><label for="ldPh{{ suffix }}">Phone</label><input id="ldPh{{ suffix }}" class="ui-input" name="phone" maxlength="30" value="{{ l.phone|default:'' }}"></div>
</div>
<div class="ui-inline-fields">
  <div class="ui-field"><label for="ldE{{ suffix }}">Email</label><input id="ldE{{ suffix }}" class="ui-input" type="email" name="email" value="{{ l.email|default:'' }}"></div>
  <div class="ui-field"><label for="ldS{{ suffix }}">Source</label><select id="ldS{{ suffix }}" class="ui-input" name="source">{% for s in sources %}<option {% if l.source == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
</div>
<div class="ui-field"><label for="ldR{{ suffix }}">Requirement</label><textarea id="ldR{{ suffix }}" class="ui-input" name="requirement" rows="2" placeholder="Dates, rooms, guests, budget">{{ l.requirement|default:'' }}</textarea></div>
<div class="ui-inline-fields">
  <div class="ui-field"><label for="ldN{{ suffix }}">Next step</label><input id="ldN{{ suffix }}" class="ui-input" name="next_action" maxlength="150" value="{{ l.next_action|default:'' }}" placeholder="e.g. Send proposal"></div>
  <div class="ui-field"><label for="ldNd{{ suffix }}">By</label><input id="ldNd{{ suffix }}" class="ui-input" type="date" name="next_action_on" value="{{ l.next_action_on|date:'Y-m-d' }}"></div>
</div>

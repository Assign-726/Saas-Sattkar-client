<!-- Hotel Staff Operations Sub-Navigation Bar -->
<style>
    .hotel-staff-nav-card {
        border-radius: 14px;
        background: #ffffff;
        border: 1px solid var(--card-border, #e2e8f0) !important;
    }
    .hotel-staff-nav-btn {
        border-radius: 9999px;
        padding: 0.45rem 1rem;
        font-weight: 600;
        font-size: 0.82rem;
        display: inline-flex;
        align-items: center;
        transition: all 0.15s ease;
    }
    .hotel-staff-nav-btn.active {
        background: var(--brand, #6366f1) !important;
        color: #ffffff !important;
        box-shadow: 0 2px 6px rgba(99, 102, 241, 0.35);
        border: 1px solid var(--brand, #6366f1) !important;
    }
    .hotel-staff-nav-btn:not(.active) {
        background: #f8fafc;
        color: #475569;
        border: 1px solid #e2e8f0;
    }
    .hotel-staff-nav-btn:not(.active):hover {
        background: #f1f5f9;
        color: #0f172a;
        border-color: #cbd5e1;
    }
    .hotel-staff-nav-badge {
        background: rgba(99,102,241,0.06);
        color: var(--brand, #6366f1);
        border-color: rgba(99,102,241,0.2) !important;
        font-size: 0.78rem;
    }
</style>

<div class="card border-0 shadow-sm mb-4 hotel-staff-nav-card">
    <div class="card-body p-2 p-md-2.5">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center gap-1.5 flex-wrap">
                <a href="{% url 'hotel_admin:muster_roll' restaurant_slug=rslug %}" 
                   class="btn btn-sm hotel-staff-nav-btn {% if active_menu == 'muster_roll' %}active{% endif %}">
                    <i class="fa-solid fa-calendar-check me-1.5"></i>
                    <span>Daily Muster Roll</span>
                </a>
                <a href="{% url 'hotel_admin:payroll_dashboard' restaurant_slug=rslug %}" 
                   class="btn btn-sm hotel-staff-nav-btn {% if active_menu == 'payroll_dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-money-bill-wave me-1.5"></i>
                    <span>Payroll &amp; Salary Slips</span>
                </a>
                <a href="{% url 'hotel_admin:sop_dashboard' restaurant_slug=rslug %}" 
                   class="btn btn-sm hotel-staff-nav-btn {% if active_menu == 'sop_dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-clipboard-check me-1.5"></i>
                    <span>Daily SOP Board</span>
                </a>
                <a href="{% url 'hotel_admin:ground_staff_list' restaurant_slug=rslug %}" 
                   class="btn btn-sm hotel-staff-nav-btn {% if active_menu == 'ground_staff_directory' %}active{% endif %}">
                    <i class="fa-solid fa-users me-1.5"></i>
                    <span>Ground Staff Team</span>
                </a>
                <a href="{% url 'hotel_admin:staff_list' restaurant_slug=rslug %}" 
                   class="btn btn-sm hotel-staff-nav-btn {% if active_menu == 'staff' %}active{% endif %}">
                    <i class="fa-solid fa-shield-halved me-1.5"></i>
                    <span>PMS User Logins &amp; Roles</span>
                </a>
            </div>
            <div class="d-none d-md-flex align-items-center gap-2">
                <span class="badge border px-3 py-2 rounded-pill font-mono hotel-staff-nav-badge">
                    <i class="fa-solid fa-hotel me-1.5"></i>{{ current_branch.name|default:current_restaurant.name }}
                </span>
            </div>
        </div>
    </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access paused</title>
    <style>
        :root { --bg: #f5f6f8; --card: #ffffff; --text: #1f2430; --muted: #5f6675; --accent: #c2410c; --border: #e3e5ea; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #11131a; --card: #1a1d26; --text: #e8eaf0; --muted: #a0a6b4; --accent: #fb923c; --border: #2a2e3a; }
        }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
               background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .card { max-width: 440px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; }
        .badge { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
        h1 { font-size: 22px; margin: 0 0 12px; }
        p { color: var(--muted); line-height: 1.55; margin: 0 0 24px; }
        a { display: inline-block; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border); color: var(--text); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">Subscription overdue</span>
        <h1>{{ restaurant.trade_name|default:restaurant.name|default:"This account" }} is paused</h1>
        <p>{{ message }}</p>
        <a href="/logout/">Sign out</a>
    </main>
</body>
</html>

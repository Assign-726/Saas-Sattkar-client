{% extends 'super_admin/base.html' %}
{% block title %}Delete Restaurant{% endblock %}
{% block content %}
<div class="grid">
  <div class="card">
    <div class="hd">Delete Restaurant</div>
    <div class="bd">
      <p class="muted">Are you sure you want to delete <strong>{{ restaurant.name }}</strong>? This action cannot be undone.</p>
      <form method="post" class="actions">
        {% csrf_token %}
        <a class="btn secondary" href="{% url 'super_admin:dashboard' %}">Cancel</a>
        <button type="submit" class="btn" style="background: var(--danger); border-color: var(--danger);">Delete</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
